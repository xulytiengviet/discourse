name: GISVN Phase 4
on:
  pull_request:
    paths: ['packages/**', 'themes/gisvn/**', '.github/workflows/gisvn-phase4.yml']
  push:
    branches: [main, gisvn-phase4-independent-packages]
    paths: ['packages/**', 'themes/gisvn/**', '.github/workflows/gisvn-phase4.yml']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/discourse-gisvn-geo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          package_json_file: packages/discourse-gisvn-geo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code -- public
      - run: ruby -c plugin.rb
      - run: node scripts/check-templates.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
