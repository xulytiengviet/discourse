name: GISVN quality

on:
  pull_request:
    paths:
      - "themes/gisvn/**"
      - "script/gisvn/**"
      - "script/import_scripts/vbulletin.rb"
      - "docs/gisvn/**"
      - ".github/workflows/gisvn-quality.yml"
  push:
    branches:
      - main
    paths:
      - "themes/gisvn/**"
      - "script/gisvn/**"
      - "script/import_scripts/vbulletin.rb"
      - "docs/gisvn/**"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find script/gisvn -type f -name '*.rb' -print0 |
            xargs -0 -n1 ruby -c
          ruby -c script/import_scripts/vbulletin.rb

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find script/gisvn -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find themes/gisvn/javascripts -type f -name '*.js' -print0)

      - name: Theme JSON
        shell: bash
        run: python -m json.tool themes/gisvn/about.json >/dev/null
